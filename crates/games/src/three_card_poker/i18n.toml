# Teks tampilan Three Card Poker (to_text, hasil) dalam dua bahasa.
[id]
"cards" = "Kamu: {player} · Bandar: {dealer}"
"hand.high_card" = "kartu tinggi"
"hand.pair" = "pair"
"hand.flush" = "flush"
"hand.straight" = "straight"
"hand.trips" = "three of a kind"
"hand.straight_flush" = "straight flush"
"bets" = "Taruhan: {bets}"
"place_bet" = "Susun taruhan: bet ante|pairplus <jumlah>, lalu deal. clear menarik taruhan, leave berhenti."
"decide" = "play (taruhan play sebesar ante) atau fold (ante kalah)."
"over.ronde_selesai" = "Ronde selesai, bersih {net} chip. Seed ronde ini dibuka."
"over.berhenti" = "Kamu berhenti sebelum kartu dibagi. Seed ronde ini dibuka."
"summary" = "Ronde selesai: bersih {net} chip."

[en]
"cards" = "You: {player} · Dealer: {dealer}"
"hand.high_card" = "high card"
"hand.pair" = "pair"
"hand.flush" = "flush"
"hand.straight" = "straight"
"hand.trips" = "three of a kind"
"hand.straight_flush" = "straight flush"
"bets" = "Bets: {bets}"
"place_bet" = "Build your bets: bet ante|pairplus <amount>, then deal. clear takes the bets back, leave stops."
"decide" = "play (a play bet equal to the ante) or fold (the ante loses)."
"over.ronde_selesai" = "Round finished, net {net} chips. This round's seed is revealed."
"over.berhenti" = "You stopped before the deal. This round's seed is revealed."
"summary" = "Round finished. Net: {net} chips."
