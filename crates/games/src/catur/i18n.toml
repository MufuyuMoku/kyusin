# Teks tampilan catur (to_text, hasil) dalam dua bahasa.
[id]
"white" = "putih"
"black" = "hitam"
"your_turn" = "Giliranmu ({color})."
"their_turn" = "Giliran {color}."
"check" = "Skak!"
"last" = "Langkah terakhir: {san}"
"end.skakmat" = "Skakmat: {winner} menang."
"end.pat" = "Remis: pat (tidak ada langkah sah, raja tidak diskak)."
"end.ulangan" = "Remis: posisi yang sama terulang tiga kali."
"end.50_langkah" = "Remis: 50 langkah tanpa tangkapan atau langkah pion."
"end.bahan" = "Remis: bahan tidak cukup untuk mat."
"end.menyerah" = "{loser} menyerah: {winner} menang."
"end.waktu" = "Waktu {loser} habis: {winner} menang."

[en]
"white" = "white"
"black" = "black"
"your_turn" = "Your turn ({color})."
"their_turn" = "{color} to move."
"check" = "Check!"
"last" = "Last move: {san}"
"end.skakmat" = "Checkmate: {winner} wins."
"end.pat" = "Draw: stalemate (no legal move, king not in check)."
"end.ulangan" = "Draw: the same position occurred three times."
"end.50_langkah" = "Draw: 50 moves without a capture or pawn move."
"end.bahan" = "Draw: not enough material to mate."
"end.menyerah" = "{loser} resigns: {winner} wins."
"end.waktu" = "{loser} ran out of time: {winner} wins."
