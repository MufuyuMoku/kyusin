# Teks tampilan Pai Gow Poker (to_text, hasil) dalam dua bahasa.
[id]
"cards" = "Kartumu: {cards}"
"hands" = "Kamu: depan {front} · belakang {back} — Bandar: depan {dfront} · belakang {dback}"
"place_bet" = "Pasang taruhan: bet <jumlah> (20–2.000, kelipatan 20), atau leave untuk berhenti."
"set" = "Susun tangan: set <kartu> <kartu> (dua kartu untuk tangan depan), atau houseway."
"over.ronde_selesai" = "Ronde selesai, bersih {net} chip. Seed ronde ini dibuka."
"over.berhenti" = "Kamu berhenti sebelum kartu dibagi. Seed ronde ini dibuka."
"summary" = "Ronde selesai: bersih {net} chip."

[en]
"cards" = "Your cards: {cards}"
"hands" = "You: front {front} · back {back} — Dealer: front {dfront} · back {dback}"
"place_bet" = "Place a bet: bet <amount> (20–2,000, multiples of 20), or leave to stop."
"set" = "Set your hands: set <card> <card> (two cards for the front hand), or houseway."
"over.ronde_selesai" = "Round finished, net {net} chips. This round's seed is revealed."
"over.berhenti" = "You stopped before the deal. This round's seed is revealed."
"summary" = "Round finished. Net: {net} chips."
