# RTP ante dengan strategi selalu perang (6 dek; seri setelah perang =
# menang raise), dihitung analitis: 97,123%. Taruhan tie (10:1): 11 × 23/311
# = 81,350%. Lihat D-060; diverifikasi simulasi (SPEC §7).
rtp = 97.12
tutorial = "tutorials/casino-war.toml"

[[perintah]]
pola = "bet <tempat> <jumlah>"
ringkas = { id = "Tambah taruhan di ante atau tie (10–2.000 per tempat, kelipatan 10)", en = "Add a bet on ante or tie (10–2,000 per spot, multiples of 10)" }

[[perintah]]
pola = "clear"
ringkas = { id = "Tarik semua taruhan yang belum dibagi", en = "Take back every bet not yet dealt" }

[[perintah]]
