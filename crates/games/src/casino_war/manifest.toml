ringkas = { id = "Bagi satu kartu untukmu dan satu untuk bandar (butuh ante)", en = "Deal one card to you and one to the dealer (needs an ante)" }

[[perintah]]
pola = "war"
ringkas = { id = "Saat seri: tambah raise sebesar ante dan berperang", en = "On a tie: add a raise equal to the ante and go to war" }

[[perintah]]
pola = "surrender"
ringkas = { id = "Saat seri: menyerah, kehilangan setengah ante", en = "On a tie: surrender and lose half the ante" }

