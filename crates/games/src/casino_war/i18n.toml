# Teks tampilan Casino War (to_text, hasil) dalam dua bahasa.
[id]
"cards" = "Kamu: {player} · Bandar: {dealer}"
"bets" = "Taruhan: {bets}"
"net" = "Bersih shoe ini: {net} · sisa {left} kartu"
"place_bet" = "Susun taruhan: bet ante <jumlah> (wajib), bet tie <jumlah> (opsional), lalu deal. clear menarik taruhan, leave berhenti."
"war" = "Seri! war (tambah raise sebesar ante) atau surrender (kehilangan setengah ante)."
"over.shoe_habis" = "Shoe habis. Seed dibuka; shoe baru dikocok di pertandingan berikutnya."
"over.berhenti" = "Kamu berhenti. Seed shoe ini dibuka."
"summary" = "Shoe selesai: {rounds} ronde, bersih {net} chip."

[en]
"cards" = "You: {player} · Dealer: {dealer}"
"bets" = "Bets: {bets}"
"net" = "Net this shoe: {net} · {left} cards left"
"place_bet" = "Build your bets: bet ante <amount> (required), bet tie <amount> (optional), then deal. clear takes the bets back, leave stops."
"war" = "A tie! war (add a raise equal to the ante) or surrender (lose half the ante)."
"over.shoe_habis" = "The shoe is finished. The seed is revealed; a new shoe is shuffled for the next match."
"over.berhenti" = "You stopped. This shoe's seed is revealed."
"summary" = "Shoe finished. Rounds: {rounds}. Net: {net} chips."
