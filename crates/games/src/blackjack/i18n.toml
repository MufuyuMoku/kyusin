"result.seri" = "seri"
"result.menyerah" = "menyerah"
"net" = "Bersih shoe ini: {net} · sisa {left} kartu"
"place_bet" = "Pasang taruhan: bet <jumlah> ({min}–{max}, kelipatan 10), atau leave untuk berhenti."
"insurance" = "Bandar menunjukkan as. Insurance setengah taruhan? insure atau decline."
