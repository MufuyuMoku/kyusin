# Teks tampilan Let It Ride (to_text, hasil) dalam dua bahasa.
[id]
"cards" = "Kamu: {player} · Bersama: {board} · Tempat: {spots}"
"place_bet" = "Pasang taruhan: bet <jumlah> (di tiga tempat, 10–2.000 per tempat, kelipatan 10), atau leave untuk berhenti."
"decide" = "Keputusan {n}: pull (tarik tempat {n}) atau ride (biarkan)."
"over.ronde_selesai" = "Ronde selesai, bersih {net} chip. Seed ronde ini dibuka."
"over.berhenti" = "Kamu berhenti sebelum kartu dibagi. Seed ronde ini dibuka."
"summary" = "Ronde selesai: bersih {net} chip."

[en]
"cards" = "You: {player} · Community: {board} · Spots: {spots}"
"place_bet" = "Place a bet: bet <amount> (on three spots, 10–2,000 per spot, multiples of 10), or leave to stop."
"decide" = "Decision {n}: pull (take back spot {n}) or ride (let it ride)."
"over.ronde_selesai" = "Round finished, net {net} chips. This round's seed is revealed."
"over.berhenti" = "You stopped before the deal. This round's seed is revealed."
"summary" = "Round finished. Net: {net} chips."
