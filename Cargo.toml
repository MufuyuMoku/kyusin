[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/games",
    "crates/bots",
    "crates/net",
    "crates/store",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
kyusin-core = { path = "crates/core" }
kyusin-games = { path = "crates/games" }
kyusin-bots = { path = "crates/bots" }
kyusin-store = { path = "crates/store" }

# RNG provably fair: ChaCha20 dengan seed eksplisit, hash SHA-256 (SPEC §3).
# Generator langkah catur (MIT); bukan shakmaty (GPL), SPEC §3.
cozy-chess = "0.3"
rand_chacha = "0.10"
rand_core = "0.10"
sha2 = "0.11"
# SQLite dibundel (SPEC §3).
rusqlite = { version = "0.40", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

# Debug info is the largest part of `target/` and neither tests nor dev
# builds need it (same choice as Onsa).
[profile.dev]
debug = false

[profile.test]
debug = false
