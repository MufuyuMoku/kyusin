[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/games",
    "crates/bots",
    "crates/net",
    "crates/store",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
kyusin-core = { path = "crates/core" }
kyusin-games = { path = "crates/games" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

# Debug info is the largest part of `target/` and neither tests nor dev
# builds need it (same choice as Onsa).
[profile.dev]
debug = false

[profile.test]
debug = false
