name: Verifikasi RTP

# SPEC §7: RTP game casino diverifikasi dengan simulasi ≥10.000.000 ronde
# lewat workflow terjadwal/manual (CI setiap push menjalankan ≥100.000).
# Gagal bila RTP simulasi di luar angka manifest ± 4 × σ/√n.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Jumlah ronde per game (minimal 10000000)"
        default: "10000000"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  blackjack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rtp

      - name: Blackjack (strategi dasar)
        run: |
          cargo run --release -p kyusin-bots --example rtp_blackjack -- \
            --rounds "${{ inputs.rounds || '10000000' }}" \
            --threads "$(nproc)" \
            --seed "ci-$GITHUB_RUN_ID" \
            --check
