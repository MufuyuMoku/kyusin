teks.en = "The opponent calls. The turn K gives you two pair. Check first to see what the opponent does."
sebelum = ["call"]
aksi = "check"
sorot = ["aksi:check"]
petunjuk.id = "Pilih CHECK."
petunjuk.en = "Choose CHECK."

[[langkah]]
