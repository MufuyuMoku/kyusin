teks.en = "The opponent checks too. River 9. Bet 100 for value with your two pair."
sebelum = ["check"]
aksi = "bet 100"
sorot = ["aksi:bet 100"]
petunjuk.id = "Susun 100 lalu pilih BET."
petunjuk.en = "Set 100, then choose BET."

[[langkah]]
teks.id = "Lawan call dengan Q J dan kalah oleh two pair A K: pot 320 untukmu. Seed sesi dibuka saat sesi selesai. Tutorial selesai."
teks.en = "The opponent calls with Q J and loses to your two pair, aces and kings: the 320 pot is yours. The session seed is revealed when the session ends. Tutorial finished."
