teks.id = "Dua kartu untukmu, dua tertutup untuk bandar, lalu flop tiga kartu. Pasang ante 50."
teks.en = "Two cards for you, two face down for the dealer, then a three-card flop. Put 50 on the ante."
aksi = "bet 50"
sorot = ["aksi:bet 50"]
petunjuk.id = "Pasang 50 lalu bagi."
petunjuk.en = "Bet 50, then deal."

