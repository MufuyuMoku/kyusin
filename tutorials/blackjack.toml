game = "blackjack"
judul = { id = "Blackjack: dasar", en = "Blackjack: basics" }

# Shoe tetap supaya setiap langkah selalu sama (tes tutorial di CI).
[config]
potong = 100
shoe = [
  # Ronde 1: 9 7 lawan bandar 10 (hole 7) → hit 4 → stand.
  "9h", "Td", "7c", "7s", "4d",
  # Ronde 2: 6 5 lawan bandar 6 (hole 10) → double → K; bandar ambil 9, bust.
  "6s", "6d", "5h", "Tc", "Kd", "9c",
  # Ronde 3: 8 8 lawan bandar 7 (hole 10) → split → 8 T, 8 9.
  "8c", "7h", "8d", "Ts", "Th", "9s",
  # Ronde 4: T 6 lawan bandar 10 (hole 8) → surrender.
  "Td", "Tc", "6s", "8h",
  # Cadangan.
  "2c", "3c", "4c", "5c", "6c", "7d", "8s", "9d", "Kc", "Qd",
]

[man.aturan]
id = """
Kamu melawan bandar. Tujuan: nilai kartumu lebih dekat ke 21 daripada bandar
tanpa lewat 21. Kartu 2–10 bernilai sesuai angkanya, J/Q/K bernilai 10, as
bernilai 1 atau 11. Dua kartu pertama as + kartu bernilai 10 adalah blackjack.

Aturan meja ini: 6 dek; taruhan 10–2.000 chip (kelipatan 10). Pemain dan
bandar masing-masing mendapat dua kartu; satu kartu bandar tertutup.
- Blackjack dibayar 3:2. Menang biasa 1:1. Nilai sama = seri (taruhan kembali).
- Bila kartu terbuka bandar as atau bernilai 10, bandar mengintip; bila
  bandar blackjack, ronde langsung selesai.
- Insurance: bila bandar menunjukkan as, kamu boleh memasang setengah
  taruhan bahwa bandar blackjack; dibayar 2:1. Strategi dasar: tolak.
- Hit = ambil kartu; stand = berhenti. Lewat 21 (bust) langsung kalah.
- Double: gandakan taruhan di dua kartu pertama mana pun (juga setelah
  split), lalu ambil tepat satu kartu.
- Split: dua kartu peringkat sama dipisah jadi dua tangan dengan taruhan
  sama, sampai 4 tangan. As yang di-split hanya mendapat satu kartu
  masing-masing, dan 21 setelah split bukan blackjack.
- Late surrender: sebagai aksi pertama (bukan setelah split), kamu boleh
  menyerah dan mendapat kembali setengah taruhan.
- Bandar mengambil kartu sampai 17 dan berdiri di semua 17, termasuk soft 17.
- Shoe dikocok ulang setelah sekitar 75% kartu terpakai.

RTP di bawah berlaku untuk strategi dasar aturan ini; bermain tanpa
strategi dasar memberi hasil lebih buruk.

Provably fair per shoe: komitmen seed diumumkan saat shoe dikocok, dan seed
dibuka saat shoe habis atau kamu berhenti. Verify lalu memutar ulang semua
ronde dalam shoe itu. Seed tidak dibuka tiap ronde karena itu akan
membocorkan urutan sisa kartu.
"""
en = """
You play against the dealer. Goal: a hand closer to 21 than the dealer's
without going over. Cards 2–10 count their number, J/Q/K count 10, an ace
counts 1 or 11. An ace plus a ten-value card as the first two cards is a
blackjack.

This table: 6 decks; bets 10–2,000 chips (multiples of 10). Player and dealer
get two cards each; one dealer card is face down.
- Blackjack pays 3:2. A normal win pays 1:1. Equal totals push (bet returned).
- If the dealer's up card is an ace or a ten-value card, the dealer peeks;
  with a dealer blackjack the round ends at once.
- Insurance: when the dealer shows an ace you may bet half your bet that the
  dealer has blackjack; it pays 2:1. Basic strategy: decline.
- Hit = take a card; stand = stop. Going over 21 (bust) loses at once.
- Double: double your bet on any first two cards (also after a split), then
  take exactly one card.
- Split: two cards of the same rank become two hands with the same bet, up
  to 4 hands. Split aces get one card each, and 21 after a split is not a
  blackjack.
- Late surrender: as your first action (not after a split) you may give up
  and get half your bet back.
- The dealer draws to 17 and stands on all 17s, including soft 17.
- The shoe is reshuffled after about 75% of the cards are used.

The RTP below applies to basic strategy for these rules; playing without
basic strategy does worse.

Provably fair per shoe: the seed commitment is announced when the shoe is
shuffled, and the seed is revealed when the shoe runs out or you stop.
Verify then replays every round in that shoe. The seed is not revealed after
each round because that would leak the order of the remaining cards.
"""

[man.kontrol]
id = """
Pilih besar taruhan dengan tombol chip, lalu [ BAGI ]. Saat giliranmu, pilih
[ HIT ], [ STAND ], [ DOUBLE ], [ SPLIT ], atau [ SURRENDER ]; tombol yang
tidak tersedia tampil redup dengan alasannya. Saat bandar menunjukkan as,
pilih [ INSURANCE ] atau [ TOLAK ]. Keyboard: panah memindahkan fokus,
Enter atau Spasi memilih. [ BERHENTI ] di antara ronde mengakhiri shoe.
"""
en = """
Choose your bet with the chip buttons, then [ DEAL ]. On your turn choose
[ HIT ], [ STAND ], [ DOUBLE ], [ SPLIT ], or [ SURRENDER ]; unavailable
buttons are dimmed with the reason. When the dealer shows an ace, choose
[ INSURANCE ] or [ DECLINE ]. Keyboard: the arrow keys move the focus, Enter
or Space selects. [ STOP ] between rounds ends the shoe.
"""

