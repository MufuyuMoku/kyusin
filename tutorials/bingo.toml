game = "bingo"
judul = { id = "Bingo: dasar", en = "Bingo: basics" }

# Kartu dan bola tetap supaya setiap langkah selalu sama (tes tutorial di CI).
[config]
kartu = [
  [1, 16, 31, 46, 61, 2, 17, 32, 47, 62, 3, 18, 0, 48, 63, 4, 19, 34, 49, 64, 5, 20, 35, 50, 65],
  [6, 21, 36, 51, 66, 7, 22, 37, 52, 67, 8, 23, 0, 53, 68, 9, 24, 39, 54, 69, 10, 25, 40, 55, 70],
]
bola = [1, 17, 49, 65, 61, 47, 19, 5, 11, 12, 13, 14, 15, 26, 27, 28, 29, 30, 41, 42, 43, 44, 45, 56, 57, 58, 59, 60, 71, 72, 73, 74, 75, 33, 38, 6, 22, 53, 69, 25]

[man.aturan]
id = """
Bingo 75 bola. Setiap kartu 5×5: kolom B 1–15, I 16–30, N 31–45 (petak
tengah bebas), G 46–60, O 61–75. Pilih 1–4 kartu dan taruhan per kartu, lalu
40 bola ditarik. Di setiap kartu, pola tertinggi yang terpenuhi dibayar
(pengali total taruhan kartu itu):
- 1 garis (baris, kolom, atau diagonal) 1,5×
- 4 sudut 2×
- 2 garis 3×
- 3 garis 4×
- X (kedua diagonal) 6×
- bingkai (16 petak tepi) 500×
- penuh (semua petak) 5.000×
RTP tepat 95,43% per kartu; 46,5% kartu mendapat pola. Taruhan 10–2.000 per
kartu, kelipatan 10. Kartu sudah terlihat sebelum bertaruh.

Provably fair per ronde: komitmen seed sebelum bertaruh; kartu dan bola dari
turunan seed ronde yang berbeda, seed dibuka sesudahnya, verify memutar ulang.
"""
en = """
75-ball bingo. Each card is 5×5: column B 1–15, I 16–30, N 31–45 (free
centre), G 46–60, O 61–75. Choose 1–4 cards and a bet per card, then 40 balls
are drawn. On each card the highest pattern completed is paid (a total
multiple of that card's bet):
- 1 line (row, column, or diagonal) 1.5×
- 4 corners 2×
- 2 lines 3×
- 3 lines 4×
- X (both diagonals) 6×
- frame (the 16 edge squares) 500×
- full card 5,000×
Exact return 95.43% per card; 46.5% of cards make a pattern. Bets 10–2,000
per card, multiples of 10. The cards are shown before you bet.

Provably fair per round: seed commitment before betting; the cards and the
balls come from different derivations of the round seed, the seed is revealed
afterwards, verify replays it.
"""

[man.kontrol]
id = """
Pilih jumlah kartu dengan [ 1 KARTU ] sampai [ 4 KARTU ], pilih nilai chip,
lalu [ TARIK · n ]. Keyboard: panah memindahkan fokus, Enter atau Spasi
memilih.
"""
en = """
Choose how many cards with [ 1 CARD ] to [ 4 CARDS ], choose a chip value,
then [ DRAW · n ]. Keyboard: the arrow keys move the focus, Enter or Space
selects.
"""

[[langkah]]
teks.id = "Mainkan dua kartu; taruhan berlaku untuk setiap kartu."
teks.en = "Play two cards; the bet applies to each card."
aksi = "cards 2"
sorot = ["aksi:cards 2"]
petunjuk.id = "Pilih 2 KARTU."
petunjuk.en = "Choose 2 CARDS."

[[langkah]]
teks.id = "Pasang 10 per kartu (20 seluruhnya) dan tarik 40 bola."
teks.en = "Bet 10 per card (20 in all) and draw 40 balls."
aksi = "bet 10"
sorot = ["aksi:bet 10"]
petunjuk.id = "Pilih TARIK · 10."
petunjuk.en = "Choose DRAW · 10."

[[langkah]]
teks.id = "Kartu 1 menutup kedua diagonal: X dibayar 6×, +50. Kartu 2 tanpa pola, −10. Bersih +40. Seed ronde dibuka. Tutorial selesai."
teks.en = "Card 1 completes both diagonals: X pays 6×, +50. Card 2 has no pattern, −10. Net +40. The round seed is revealed. Tutorial finished."
