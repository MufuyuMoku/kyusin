teks.en = "Player 5 draws an ace → 6. Banker 6, and the player's third card is an ace, so the banker stands. 6 against 6: a tie. Tie pays 8:1 (+160) and the Banker bet comes back. The shoe seed is revealed when the shoe runs out or you stop. Tutorial finished."
