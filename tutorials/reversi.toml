game = "reversi"
judul = { id = "Reversi: dasar", en = "Reversi: basics" }

[man.aturan]
id = """
Papan 8×8. Dua pemain: hitam (●) jalan duluan, lalu putih (○), bergantian.

Letakkan satu bidak di petak kosong sehingga satu atau lebih garis lurus
bidak lawan (mendatar, tegak, atau diagonal) terapit di antara bidak baru dan
bidakmu yang sudah ada. Semua bidak lawan yang terapit dibalik menjadi
warnamu. Langkah yang tidak mengapit apa pun tidak sah.

Bila kamu tidak punya langkah sah, kamu wajib pass; pass hanya boleh saat itu.
Permainan selesai bila kedua pemain tidak bisa melangkah. Yang punya bidak
terbanyak menang; sama banyak berarti seri.
"""
en = """
8×8 board. Two players: black (●) moves first, then white (○), in turn.

Place one disc on an empty square so that one or more straight lines of your
opponent's discs (horizontal, vertical, or diagonal) are flanked between the
new disc and one of your discs already on the board. Every flanked disc is
flipped to your colour. A move that flanks nothing is not legal.

If you have no legal move you must pass; passing is allowed only then. The
game ends when neither player can move. Whoever has more discs wins; equal
counts are a draw.
"""

[man.kontrol]
id = """
Klik petak bertanda · (langkah sah) untuk meletakkan bidak. Dengan keyboard:
panah memindahkan kursor di papan, Enter atau Spasi meletakkan bidak, Tab
keluar dari papan. Bila tidak ada langkah, pilih [ PASS ].
"""
en = """
Click a square marked · (a legal move) to place a disc. With the keyboard:
the arrow keys move the cursor on the board, Enter or Space places a disc,
Tab leaves the board. If you have no move, choose [ PASS ].
"""

[[langkah]]
teks.id = "Kamu hitam (●) dan jalan duluan. Titik · menandai petak tempat kamu boleh meletakkan bidak."
teks.en = "You are black (●) and move first. A dot · marks each square where you may place a disc."

[[langkah]]
teks.id = "Letakkan bidak di d3. Bidak putih di d4 terapit antara d3 dan d5, jadi dibalik menjadi hitam."
teks.en = "Place a disc on d3. The white disc on d4 is flanked between d3 and d5, so it flips to black."
aksi = "d3"
sorot = ["aksi:d3"]
petunjuk.id = "Pilih petak d3: kolom d, baris 3."
petunjuk.en = "Choose square d3: column d, row 3."

[[langkah]]
teks.id = "Putih membalas di c5 dan membalik d5. Sekarang letakkan di f6: e5 terapit secara diagonal antara f6 dan d4."
teks.en = "White answers on c5 and flips d5. Now place on f6: e5 is flanked diagonally between f6 and d4."
sebelum = ["c5"]
aksi = "f6"
sorot = ["aksi:f6"]
petunjuk.id = "Garis diagonal juga dihitung. Pilih f6."
petunjuk.en = "Diagonal lines count too. Choose f6."

[[langkah]]
teks.id = "Bila kamu tidak punya langkah sah, kamu wajib pass. Permainan selesai bila kedua pemain tidak bisa melangkah; bidak terbanyak menang."
teks.en = "If you have no legal move, you must pass. The game ends when neither player can move; the most discs wins."

[[langkah]]
teks.id = "Tutorial selesai. Coba lawan bot level 1 untuk berlatih."
teks.en = "Tutorial finished. Try bot level 1 to practise."
