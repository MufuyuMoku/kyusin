game = "deuces-wild"
judul = { id = "Deuces Wild: dasar", en = "Deuces Wild: basics" }

# Urutan dek tetap supaya setiap langkah selalu sama (tes tutorial di CI):
# lima pertama dibagi, sisanya pengganti berurutan.
[config]
kartu = ["2s", "2h", "7c", "9d", "Kh", "2d", "5c", "8h", "3s", "Qd"]

[man.aturan]
id = """
Video Poker dengan 52 kartu; keempat kartu 2 (deuce) bisa menjadi kartu apa saja. Bayaran (pengali total taruhan):
- Royal Flush alami 800, empat deuce 200, Royal Flush dengan deuce 25
- Five of a Kind 16, Straight Flush 10, Four of a Kind 4, Full House 4
- Flush 3, Straight 2, Three of a Kind 1
Pasang taruhan, lima kartu dibagi. Tahan kartu yang ingin dipertahankan,
lalu DRAW mengganti sisanya dengan kartu dari dek yang sama. Tangan akhir
dibayar menurut tabel. Satu taruhan dibayar seperti lima koin (Royal Flush
selalu 800×). RTP dengan strategi optimal 99,73% (nilai harapan tepat untuk
setiap pilihan tahan). Taruhan 10–2.000, kelipatan 10.

Provably fair per tangan: komitmen seed sebelum bertaruh, dek dikocok dari
seed ronde, seed dibuka sesudahnya, verify memutar ulang.
"""
en = """
Video poker with 52 cards; the four 2s (deuces) can be any card. Payouts (total multiple of the bet):
- Natural Royal Flush 800, four deuces 200, Royal Flush with deuces 25
- Five of a Kind 16, Straight Flush 10, Four of a Kind 4, Full House 4
- Flush 3, Straight 2, Three of a Kind 1
Place a bet and five cards are dealt. Hold the cards you want to keep, then
DRAW replaces the rest with cards from the same deck. The final hand is paid
from the table. One bet is paid like five coins (a Royal Flush always pays
800×). The return with optimal strategy is 99.73% (the exact expected value of
every hold). Bets 10–2,000, multiples of 10.

Provably fair per hand: seed commitment before betting, the deck is shuffled
from the round seed, the seed is revealed afterwards, verify replays it.
"""

[man.kontrol]
id = """
Pilih nilai chip lalu [ BAGI · n ]. Klik kartu untuk menahan atau
melepasnya, lalu [ DRAW ]. Keyboard: panah memindahkan fokus, Enter atau
Spasi memilih.
"""
en = """
Choose a chip value, then [ DEAL · n ]. Click a card to hold or release it,
then [ DRAW ]. Keyboard: the arrow keys move the focus, Enter or Space
selects.
"""

[[langkah]]
teks.id = "Pasang 10 dan bagi lima kartu."
teks.en = "Bet 10 and deal five cards."
aksi = "bet 10"
sorot = ["aksi:bet 10"]
petunjuk.id = "Pilih BAGI · 10."
petunjuk.en = "Choose DEAL · 10."

[[langkah]]
teks.id = "Dua deuce: strategi optimal menahan keduanya saja (kartu 1 dan 2)."
teks.en = "Two deuces: the optimal play holds just the two of them (cards 1 and 2)."
aksi = "draw 1 2"
sorot = ["aksi:draw 1 2"]
petunjuk.id = "Tahan kartu 1 dan 2, lalu pilih DRAW."
petunjuk.en = "Hold cards 1 and 2, then choose DRAW."

[[langkah]]
teks.id = "Deuce ketiga datang: tiga deuce + 5 = Four of a Kind, 4 × 10 = 40, bersih +30. Seed ronde dibuka. Tutorial selesai."
teks.en = "A third deuce arrives: three deuces + 5 = Four of a Kind, 4 × 10 = 40, net +30. The round seed is revealed. Tutorial finished."
